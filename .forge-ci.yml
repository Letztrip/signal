# Forge CI pipeline for Letztrip/signal (generated by gen-pipelines-v2.py)
# Each job starts the EXISTING Cloud Build trigger of the same name; the
# repo's cloudbuild yaml stays the source of truth. Branch model:
#   dev -> *-dev (no traffic), main-preview -> *-preview (no traffic),
#   main -> production (live, needs 2 approvals in Forge).
stages: [deploy]

default:
  timeout: 90m

jobs:
  signal-prod-deploy:
    stage: deploy
    environment: production
    tags: [gcp, deploy]
    rules:
      - if: '$CI_COMMIT_REF =~ /v[0-9]/'
      - when: never
    script:
      - |
        set -eu
        # Forge (unmodified upstream) clones the connected repo at the pipeline's
        # commit into the job workspace; the commit and tag come from git, nothing
        # is injected by the server.
        SHA=$(git rev-parse HEAD); SHORT=$(git rev-parse --short=7 HEAD)
        git fetch -q --tags --depth=1 origin
        REF=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
        [ -n "$REF" ] || { echo "commit carries no tag: a branch push, nothing to deploy"; exit 0; }
        echo "forge -> cloud build trigger signal-prod-deploy --tag=$REF "
        BUILD_ID=$(gcloud builds triggers run signal-prod-deploy --project=letztrip-production-account --region=global --tag="$REF" --format='value(metadata.build.id)')
        echo "build: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=letztrip-production-account"
        while :; do
          STATUS=$(gcloud builds describe "$BUILD_ID" --project=letztrip-production-account --format='value(status)')
          echo "$(date -u +%H:%M:%S) $STATUS"
          case "$STATUS" in
            SUCCESS) exit 0 ;;
            FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
          esac
          sleep 20
        done
