# Forge CI pipeline for Letztrip/signal (generated by gen-pipelines-v2.py)
# Each job starts the EXISTING Cloud Build trigger of the same name; the
# repo's cloudbuild yaml stays the source of truth. Branch model:
#   dev -> *-dev (no traffic), main-preview -> *-preview (no traffic),
#   main -> production (live, needs 2 approvals in Forge).
stages: [ci, deploy]

default:
  timeout: 90m

jobs:
  ci-build:
    stage: ci
    tags: [gcp, staging]
    script:
      - |
        set -eu
        SHA=$(git rev-parse --short=7 HEAD); OBJ=forge-ci/$SHA-$CI_JOB_ID.tgz
        tar czf /tmp/src.tgz --exclude=.git --exclude=node_modules --exclude=.next --exclude=target --exclude=bin --exclude=obj .
        gsutil -q cp /tmp/src.tgz gs://letztrip-production-account_cloudbuild/$OBJ
        gsutil -q cp gs://letztrip-production-account-forge-artifacts/ci/ci.cloudbuild.json /tmp/ci.json
        python3 - "$OBJ" build <<'PY' > /tmp/build.json
        import json, sys
        b = json.load(open('/tmp/ci.json'))
        b['source'] = {'storageSource': {'bucket': 'letztrip-production-account_cloudbuild', 'object': sys.argv[1]}}
        b['substitutions'] = {'_CHECK': sys.argv[2]}
        json.dump(b, sys.stdout)
        PY
        echo "forge -> cloud build CI (build) on $SHA"
        BUILD_ID=$(curl -sS -X POST -H "Authorization: Bearer $(gcloud auth print-access-token)" -H 'Content-Type: application/json' --data-binary @/tmp/build.json https://cloudbuild.googleapis.com/v1/projects/letztrip-production-account/builds | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("metadata",{}).get("build",{}).get("id") or sys.exit("create failed: "+json.dumps(d)[:300]))')
        echo "build: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=letztrip-production-account"
        while :; do
          STATUS=$(gcloud builds describe "$BUILD_ID" --project=letztrip-production-account --format='value(status)')
          echo "$(date -u +%H:%M:%S) $STATUS"
          case "$STATUS" in
            SUCCESS) exit 0 ;;
            FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
          esac
          sleep 15
        done

  ci-test:
    stage: ci
    tags: [gcp, staging]
    allow_failure: true
    script:
      - |
        set -eu
        SHA=$(git rev-parse --short=7 HEAD); OBJ=forge-ci/$SHA-$CI_JOB_ID.tgz
        tar czf /tmp/src.tgz --exclude=.git --exclude=node_modules --exclude=.next --exclude=target --exclude=bin --exclude=obj .
        gsutil -q cp /tmp/src.tgz gs://letztrip-production-account_cloudbuild/$OBJ
        gsutil -q cp gs://letztrip-production-account-forge-artifacts/ci/ci.cloudbuild.json /tmp/ci.json
        python3 - "$OBJ" test <<'PY' > /tmp/build.json
        import json, sys
        b = json.load(open('/tmp/ci.json'))
        b['source'] = {'storageSource': {'bucket': 'letztrip-production-account_cloudbuild', 'object': sys.argv[1]}}
        b['substitutions'] = {'_CHECK': sys.argv[2]}
        json.dump(b, sys.stdout)
        PY
        echo "forge -> cloud build CI (test) on $SHA"
        BUILD_ID=$(curl -sS -X POST -H "Authorization: Bearer $(gcloud auth print-access-token)" -H 'Content-Type: application/json' --data-binary @/tmp/build.json https://cloudbuild.googleapis.com/v1/projects/letztrip-production-account/builds | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("metadata",{}).get("build",{}).get("id") or sys.exit("create failed: "+json.dumps(d)[:300]))')
        echo "build: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=letztrip-production-account"
        while :; do
          STATUS=$(gcloud builds describe "$BUILD_ID" --project=letztrip-production-account --format='value(status)')
          echo "$(date -u +%H:%M:%S) $STATUS"
          case "$STATUS" in
            SUCCESS) exit 0 ;;
            FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
          esac
          sleep 15
        done

  ci-security:
    stage: ci
    tags: [gcp, staging]
    allow_failure: true
    script:
      - |
        set -eu
        SHA=$(git rev-parse --short=7 HEAD); OBJ=forge-ci/$SHA-$CI_JOB_ID.tgz
        tar czf /tmp/src.tgz --exclude=.git --exclude=node_modules --exclude=.next --exclude=target --exclude=bin --exclude=obj .
        gsutil -q cp /tmp/src.tgz gs://letztrip-production-account_cloudbuild/$OBJ
        gsutil -q cp gs://letztrip-production-account-forge-artifacts/ci/ci.cloudbuild.json /tmp/ci.json
        python3 - "$OBJ" security <<'PY' > /tmp/build.json
        import json, sys
        b = json.load(open('/tmp/ci.json'))
        b['source'] = {'storageSource': {'bucket': 'letztrip-production-account_cloudbuild', 'object': sys.argv[1]}}
        b['substitutions'] = {'_CHECK': sys.argv[2]}
        json.dump(b, sys.stdout)
        PY
        echo "forge -> cloud build CI (security) on $SHA"
        BUILD_ID=$(curl -sS -X POST -H "Authorization: Bearer $(gcloud auth print-access-token)" -H 'Content-Type: application/json' --data-binary @/tmp/build.json https://cloudbuild.googleapis.com/v1/projects/letztrip-production-account/builds | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("metadata",{}).get("build",{}).get("id") or sys.exit("create failed: "+json.dumps(d)[:300]))')
        echo "build: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=letztrip-production-account"
        while :; do
          STATUS=$(gcloud builds describe "$BUILD_ID" --project=letztrip-production-account --format='value(status)')
          echo "$(date -u +%H:%M:%S) $STATUS"
          case "$STATUS" in
            SUCCESS) exit 0 ;;
            FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
          esac
          sleep 15
        done

  signal-prod-deploy-preview:
    stage: deploy
    environment: signal-prod-deploy-preview
    tags: [gcp, staging]
    rules:
      - if: '$CI_COMMIT_REF =~ /[0-9]+[.][0-9]+/'
      - when: never
    script:
      - |
        set -eu
        git fetch -q --tags --depth=1 origin
        REF=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
        [ -n "$REF" ] || { echo "commit carries no tag: nothing to deploy"; exit 0; }
        echo "forge -> cloud build trigger signal-prod-deploy --tag=$REF (preview, no traffic)"
        BUILD_ID=$(gcloud builds triggers run signal-prod-deploy --project=letztrip-production-account --region=global --tag="$REF" --substitutions='_DEPLOY_FLAGS=--no-traffic --tag=preview' --format='value(metadata.build.id)')
        echo "build: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=letztrip-production-account"
        while :; do
          STATUS=$(gcloud builds describe "$BUILD_ID" --project=letztrip-production-account --format='value(status)')
          echo "$(date -u +%H:%M:%S) $STATUS"
          case "$STATUS" in
            SUCCESS) exit 0 ;;
            FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
          esac
          sleep 20
        done
